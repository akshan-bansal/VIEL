# Controlled venue reference data (Contract B), registry version 2.0.
#
# ALL IDENTIFIERS IN THIS FILE ARE ILLUSTRATIVE. They describe the synthetic
# venues used by the replay/simulation scenario and must not be read as
# statements about any real market or MIC.
#
# Each record is immutable. A change is made by proposing a change request
# (identity/mapping_history.py) that is approved by a different principal; the
# approved change creates a new registry version that supersedes records rather
# than editing them, so any historical version can be replayed exactly.
#
# Time axes (bitemporal):
#   valid_from / valid_to  -> business time: when the alias meant this venue
#   registry version       -> system time: when the audit learned about it
registry_version: "2.0"
registry_created_at: "2026-10-01T00:00:00Z"
approved_by: REFERENCE_DATA_CONTROL

records:
  - venue_id: VENUE_A
    mic: XVNA
    operating_mic: XVNA
    raw_aliases: ["VNA"]
    venue_name: Example Lit Exchange A
    venue_type: EXCHANGE
    country: CA
    valid_from: "2026-01-01T00:00:00Z"
    valid_to: null
    status: ACTIVE

  - venue_id: VENUE_B
    mic: XVNB
    operating_mic: XVNB
    raw_aliases: ["VNB"]
    broker_aliases:
      BROKER_B: ["B_ROUTE_7"]
    venue_name: Example Lit Exchange B
    venue_type: EXCHANGE
    country: CA
    valid_from: "2026-07-01T00:00:00Z"
    valid_to: null
    status: ACTIVE

  # Historical alias: "VNB_OLD" referred to VENUE_B only during H1 2026.
  - venue_id: VENUE_B
    mic: XVNB
    operating_mic: XVNB
    raw_aliases: ["VNB", "VNB_OLD"]
    venue_name: Example Lit Exchange B
    venue_type: EXCHANGE
    country: CA
    valid_from: "2026-01-01T00:00:00Z"
    valid_to: "2026-07-01T00:00:00Z"
    status: ACTIVE

