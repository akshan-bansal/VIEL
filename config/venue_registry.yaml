  - venue_id: VENUE_D
    mic: XVND
    operating_mic: XVND
    raw_aliases: ["VND", "DARK_D"]
    venue_name: Example Alternative Trading System D
    venue_type: ATS
    country: CA
    valid_from: "2026-01-01T00:00:00Z"
    valid_to: null
    status: ACTIVE

  # Known reference-data defect carried in v2.0 for the audit scenario:
  # BROKER_B's "SMART" destination was registered against two venues.
  # Resolution must return AMBIGUOUS, never pick one.
  - venue_id: VENUE_A
    mic: XVNA
    operating_mic: XVNA
    raw_aliases: []
    broker_aliases:
      BROKER_B: ["SMART"]
    venue_name: Example Lit Exchange A
    venue_type: EXCHANGE
    country: CA
    valid_from: "2026-01-01T00:00:00Z"
    valid_to: null
    status: ACTIVE

  - venue_id: VENUE_D
    mic: XVND
    operating_mic: XVND
    raw_aliases: []
    broker_aliases:
      BROKER_B: ["SMART"]
    venue_name: Example Alternative Trading System D
    venue_type: ATS
    country: CA
    valid_from: "2026-01-01T00:00:00Z"
    valid_to: null
    status: ACTIVE

  # Stale reference data carried in v2.0: VENUE_X's MIC is EXPIRED in the
  # authoritative ISO 10383 snapshot, but the registry still says ACTIVE.
  # Resolution must return INVALID, never VENUE_X.
  - venue_id: VENUE_X
    mic: XVNX
    operating_mic: XVNX
    raw_aliases: []
    venue_name: Example Delisted Venue X
    venue_type: EXCHANGE
    country: CA
