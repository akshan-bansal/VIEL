# FIX protocol dictionary used by the ingestion parser and validator.
#
# This is a deliberately small, explicit dictionary covering the tags the audit
# consumes. Tags outside this dictionary (and outside the broker-specific custom
# tag list) are NOT dropped: they are retained in the parsed message and raise an
# UNKNOWN_FIX_TAG exception (severity MEDIUM) for dictionary-compatibility review.
dictionary_version: "2026.11.1"

tags:
  1: Account
  6: AvgPx
  8: BeginString
  9: BodyLength
  10: CheckSum
  11: ClOrdID
  14: CumQty
  17: ExecID
  19: ExecRefID
  20: ExecTransType
  30: LastMkt
  31: LastPx
  32: LastQty
  34: MsgSeqNum
  35: MsgType
  36: NewSeqNo
  37: OrderID
  38: OrderQty
  39: OrdStatus
  40: OrdType
  41: OrigClOrdID
  43: PossDupFlag
  44: Price
  49: SenderCompID
  52: SendingTime
  54: Side
  55: Symbol
  56: TargetCompID
  58: Text
  59: TimeInForce
  60: TransactTime
  97: PossResend
  99: StopPx
  100: ExDestination
  122: OrigSendingTime
  123: GapFillFlag
  141: ResetSeqNumFlag
  150: ExecType
  151: LeavesQty
  583: ClOrdLinkID
  1133: ExDestinationIDSource

# Enumerations. Values outside these sets are reported, never coerced.
enums:
  20: {"0": NEW, "1": CANCEL, "2": CORRECT, "3": STATUS}
  39: {"0": NEW, "1": PARTIALLY_FILLED, "2": FILLED, "3": DONE_FOR_DAY, "4": CANCELED,
       "5": REPLACED, "6": PENDING_CANCEL, "8": REJECTED, "A": PENDING_NEW, "C": EXPIRED,
       "E": PENDING_REPLACE}
  40: {"1": MARKET, "2": LIMIT, "3": STOP, "4": STOP_LIMIT, "5": MARKET_ON_CLOSE,
       "6": WITH_OR_WITHOUT, "7": LIMIT_OR_BETTER, "8": LIMIT_WITH_OR_WITHOUT,
       "9": ON_BASIS, "D": PREVIOUSLY_QUOTED, "E": PREVIOUSLY_INDICATED,
       "G": FOREX_SWAP, "I": FUNARI, "J": MARKET_IF_TOUCHED,
       "K": MARKET_WITH_LEFTOVER_AS_LIMIT, "L": PREVIOUS_FUND_VALUATION_POINT,
       "M": NEXT_FUND_VALUATION_POINT, "P": PEGGED, "Q": COUNTER_ORDER_SELECTION}
  54: {"1": BUY, "2": SELL, "5": SELL_SHORT, "6": SELL_SHORT_EXEMPT}
  59: {"0": DAY, "1": GTC, "2": OPG, "3": IOC, "4": FOK, "6": GTD, "7": AT_THE_CLOSE}
  150: {"0": NEW, "1": PARTIAL_FILL, "2": FILL, "3": DONE_FOR_DAY, "4": CANCELED,
        "5": REPLACED, "6": PENDING_CANCEL, "8": REJECTED, "A": PENDING_NEW,
        "C": EXPIRED, "D": RESTATED, "E": PENDING_REPLACE, "F": TRADE,
        "G": TRADE_CORRECT, "H": TRADE_CANCEL, "I": ORDER_STATUS}
  1133: {"B": BIC, "C": GENERAL_IDENTIFIER, "D": PROPRIETARY, "E": ISO_COUNTRY_CODE,
         "G": MIC}

# Required tags per message type and protocol version.
protocols:
  FIX.4.2:
    # FIX 4.2 signals corrections/busts through ExecTransType (20) rather than ExecType G/H.
    exec_correction_semantics: EXEC_TRANS_TYPE
    required:
      "D": [11, 54, 55, 38, 40, 60]
      "8": [17, 20, 37, 39, 150, 54, 55]
      "4": [36]
  FIX.4.4:
    exec_correction_semantics: EXEC_TYPE
    required:
      "D": [11, 54, 55, 38, 40, 60]
      "8": [17, 37, 39, 150, 54, 55]
      "4": [36]

# Session-level message types that carry no order or execution content.
session_message_types: ["0", "1", "2", "3", "4", "5", "A"]

# Order lineage tags. Parent order linkage is broker/OMS specific; it must be
# declared here rather than inferred.
lineage:
  parent_order_id_tag: 583          # ClOrdLinkID
  client_order_id_tag: 9001         # broker custom tag (see custom_tags)

# Broker-specific custom tags. A custom tag is only "known" for the broker that
# declares it.
custom_tags:
  BROKER_A:
    9001: ClientOrderID
  BROKER_B:
    9001: ClientOrderID
