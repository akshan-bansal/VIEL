# Local stack: audit API + PostgreSQL + Prometheus + Grafana.
# Replay/simulation only — nothing here connects to a trading session.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-via_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-venue_integrity}
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/0001_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]

  api:
    build: { context: ., dockerfile: deployment/Dockerfile }
    environment:
      VIA_MODE: ${VIA_MODE:-replay}
      VIA_API_KEYS: ${VIA_API_KEYS:?set VIA_API_KEYS in .env}
      VIA_RAW_STORE_PATH: /data/raw_events.sqlite
      VIA_RATE_LIMIT_PER_MINUTE: ${VIA_RATE_LIMIT_PER_MINUTE:-600}
      VIA_BOOTSTRAP: ${VIA_BOOTSTRAP:-simulation}
    volumes: [apidata:/data]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [postgres]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deployment/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata: {}
  apidata: {}
