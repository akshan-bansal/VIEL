[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "venue-integrity-audit"
version = "1.0.0"
description = "Venue Integrity Audit (VIA): replay-mode audit of venue identity, order classification, execution attribution, venue influence and SOR decisions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "prometheus-client>=0.20",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "fastapi>=0.110",
    "prometheus-client>=0.20",
]

[project.scripts]
via = "venue_integrity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
venue_integrity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end tests that run the full synthetic scenario",
    "postgres: tests that need a live PostgreSQL server (VIA_TEST_PG_DSN)",
]
